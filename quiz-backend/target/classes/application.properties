spring.application.name=quiz-backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# update = Hibernate adds missing tables/columns on start (handy while developing).
# For a real deployment set DDL_AUTO=validate and manage the schema yourself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# SQL logging is very noisy; turn it on with SHOW_SQL=true when debugging.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# The default below is for LOCAL DEVELOPMENT ONLY. With SPRING_PROFILES_ACTIVE=prod the app
# refuses to start until you set your own long random JWT_SECRET (at least 32 characters).
jwt.secret=${JWT_SECRET:9a4f2c8d7e6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma-separated list of frontend origins allowed to call this API
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limits (requests per minute, per client IP). Generous on purpose: a whole
# classroom or event can share one public IP.
rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MIN:20}
rate-limit.status-per-minute=${RATE_LIMIT_STATUS_PER_MIN:120}
rate-limit.join-per-minute=${RATE_LIMIT_JOIN_PER_MIN:200}

# Behind a reverse proxy (Render, Railway, nginx...) set FORWARD_HEADERS_STRATEGY=native so the
# rate limiter sees each visitor's real IP instead of the proxy's.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}